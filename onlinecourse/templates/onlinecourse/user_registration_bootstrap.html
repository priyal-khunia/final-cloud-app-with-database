<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - OnlineCourse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
        .card { border: none; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .btn-register { background: linear-gradient(135deg, #667eea, #764ba2); border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1.05rem; }
        .form-control { border-radius: 8px; padding: 12px; border: 2px solid #e0e7ff; }
        .form-control:focus { border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-5">
                <h2 class="text-center fw-bold mb-2">🎓 Create Account</h2>
                <p class="text-center text-muted mb-4">Join OnlineCourse today</p>
                {% if message %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endif %}
                <form method="post" action="{% url 'onlinecourse:registration' %}">
                    {% csrf_token %}
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" name="firstname" class="form-control" placeholder="First name" required>
                        </div>
                        <div class="col">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" name="lastname" class="form-control" placeholder="Last name" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="psw" class="form-control" placeholder="Create a password" required>
                    </div>
                    <button type="submit" class="btn btn-register text-white">Create Account</button>
                </form>
                <p class="text-center mt-4 mb-0">Already have an account? <a href="{% url 'onlinecourse:login' %}">Login</a></p>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
